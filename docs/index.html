<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gameboy Forth</title>
  <style>
    #canvas {
      width: 100%;
      max-width: 640px;
    }
    .buttons {
      width: 100%;
      max-width: 640px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 10px;
    }
    .dpad { background: black; color: gray; padding: 20px; border: 0; }
    .action { border-radius: 50%; width: 50px; height: 50px; background: red }
    .up { grid-row: 1; grid-column: 2; }
    .down { grid-row: 3; grid-column: 2; }
    .left { grid-row: 2; grid-column: 1; }
    .right { grid-row: 2; grid-column: 3; }
    .select { grid-row: 3; grid-column: 4; }
    .start { grid-row: 3; grid-column: 5; }
    .b { grid-row: 2; grid-column: 6; }
    .a { grid-row: 1; grid-column: 7; }
  </style>
</head>
<body>
  <canvas id="canvas" width="640" height="576" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById('canvas')
    };
  </script>
  <script src="gameboy.js"></script>
  <div class="buttons">
    <button class="dpad up" data-code="ArrowUp" data-keycode="38">↑</button>
    <button class="dpad down" data-code="ArrowDown" data-keycode="40">↓</button>
    <button class="dpad left" data-code="ArrowLeft" data-keycode="37">←</button>
    <button class="dpad right" data-code="ArrowRight" data-keycode="39">→</button>
    <button class="start" data-code="Enter" data-keycode="13">Start</button>
    <button class="select">Select</button>
    <button class="action b" data-code="KeyS" data-key="s" data-keycode="83">B</button>
    <button class="action a" data-code="KeyA" data-key="a" data-keycode="65">A</button>
  </div>
  <script>
    document.addEventListener('keydown', (e) => console.log(e));
    document.querySelectorAll('[data-code]').forEach((button) => {
      button.addEventListener('click', () => {
        const key = {
          key: button.dataset['key'] || button.dataset['code'],
          code: button.dataset['code'],
          keyCode: +button.dataset['keycode'], 
          which: +button.dataset['keycode'],
          bubbles: true,
          cancelable: true,
        };
        document.dispatchEvent(new KeyboardEvent('keydown', key));
        setTimeout(() => document.dispatchEvent(new KeyboardEvent('keyup', key)), 100);
      });
    });
  </script>
  <pre>
  Arrow keys are directional buttons (cursor movement)
  &lt;Enter&gt; is start (run program)
  &lt;A&gt; is A button (accept character)
  &lt;S&gt; is B button (backspace)
  </pre>
</body>
</html>
